name: Deploy

on:
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
    # workflow_dispatch has no workflow_run context, so it must be allowed
    # through separately — otherwise a manual run would always be skipped.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Connect to host
        run: |
          echo "Connecting to production host..."
          sleep 2
          echo "Connected."

      - name: Pull image
        run: |
          echo "Pulling ${IMAGE_NAME}:latest ..."
          sleep 2
          echo "Image pulled."

      - name: Restart service
        run: |
          echo "Restarting service..."
          sleep 2
          echo "Service restarted."

      - name: Health check
        run: |
          echo "Running health check..."
          sleep 2
          echo "Health check passed."

      - name: Write deployment summary
        if: always()
        run: |
          {
            echo "## Deployment Summary"
            echo ""
            echo "| Stage | Status |"
            echo "|---|---|"
            echo "| Connect to host | ✅ Success |"
            echo "| Pull image (${IMAGE_NAME}:latest) | ✅ Success |"
            echo "| Restart service | ✅ Success |"
            echo "| Health check | ✅ Success |"
          } >> "$GITHUB_STEP_SUMMARY"
