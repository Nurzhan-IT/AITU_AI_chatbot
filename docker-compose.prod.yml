services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    expose:
      - "6333"
      - "6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__MAX_REQUEST_SIZE_MB: "32"
    deploy:
      resources:
        limits:
          memory: 600M

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./pdfs:/usr/share/nginx/html/pdfs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 64M

  bot:
    build: .
    restart: always
    env_file: .env
    environment:
      QDRANT_HOST: qdrant
    volumes:
      - ./pdfs:/app/pdfs
      - ./data:/app/data
    depends_on:
      - qdrant
    deploy:
      resources:
        limits:
          memory: 512M
