server {
    listen 80;
    server_name jt-logistic.kz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jt-logistic.kz;

    ssl_certificate /etc/letsencrypt/live/jt-logistic.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jt-logistic.kz/privkey.pem;

    location /pdfs/ {
        alias /usr/share/nginx/html/pdfs/;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
        types {
            application/pdf pdf;
        }
        default_type application/octet-stream;
        autoindex off;
    }

    location / {
        return 404;
    }
}
