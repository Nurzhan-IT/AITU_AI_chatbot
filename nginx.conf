server {
    listen 80;
    server_name localhost;

    location /pdfs/ {
        alias /usr/share/nginx/html/pdfs/;
        add_header Content-Disposition "inline";
        add_header X-Content-Type-Options "nosniff";
        types {
            application/pdf pdf;
        }
        default_type application/octet-stream;
        autoindex off;
    }

    location / {
        return 404;
    }
}
