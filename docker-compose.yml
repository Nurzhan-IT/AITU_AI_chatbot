services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./pdfs:/usr/share/nginx/html/pdfs:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http nginx:80 --domain=${NGROK_DOMAIN}
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    depends_on:
      - nginx
    ports:
      - "4040:4040"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./pdfs:/app/pdfs
      - ./data:/app/data
    depends_on:
      - qdrant
      - nginx
      - ngrok
